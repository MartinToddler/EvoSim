# Continuous integration for Project EON.
#
# Contract (CLAUDE.md "Toolchain policy", review point P2-c): every push and
# every pull request runs Node 22 + pnpm with a frozen lockfile, then
# `pnpm verify` (typecheck -> lint -> test -> build).
#
# No secrets, and no network access beyond the npm registry.
name: verify

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch or PR, but never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    # A hang detector, not a performance assertion (docs/07 §8, and the same
    # reasoning ADR 0007 §1 applied to the Vitest budgets).
    #
    # 20 minutes silently stopped verifying anything from Milestone 4 onward:
    # runs 8 through 13 were all cancelled at 20m20s, because the suite is
    # dominated by the 100 000-tick soaks and has cost more than that since the
    # evolution milestone landed. A cancelled run reads as "not green" rather
    # than "failed", which is how it went unnoticed for five milestones.
    #
    # The right long-term lever is scheduling the soaks separately rather than
    # shortening them (ADR 0006 §9, docs/07 §6 wants 100 000 ticks routinely);
    # until then the budget has to clear the real cost with headroom.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # pnpm must be installed BEFORE actions/setup-node: `cache: pnpm` shells
      # out to `pnpm store path` and fails if pnpm is not yet on PATH.
      # No `version:` input on purpose — pnpm/action-setup reads the
      # "packageManager" field from package.json, and passing both is an error.
      - uses: pnpm/action-setup@v4

      # .nvmrc is the single source of truth for the Node major. It must be
      # selected before installing, because .npmrc sets engine-strict=true and
      # the workspace requires Node >= 22.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --frozen-lockfile makes CI fail rather than silently resolve new
      # versions when a package.json and pnpm-lock.yaml disagree; dependency
      # versions are part of the determinism contract. esbuild's postinstall
      # runs because it is allow-listed in the root pnpm.onlyBuiltDependencies,
      # without which `vite build` has no native binary.
      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # `pnpm verify` never executes the headless runner, so the CLI that
      # regenerates the golden fixture would rot unnoticed.
      - name: Headless runner smoke test
        run: pnpm exec tsx scripts/headless.ts --ticks 100 --checkpoints 0,100

  determinism:
    name: determinism (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: verify
    # Default branch and manual runs only.
    #
    # This matrix is the most expensive thing in the repository: it runs the
    # engine suite three times, and GitHub bills macOS minutes at 10x and
    # Windows at 2x. At ~20 minutes a run that is ~200 billed minutes for the
    # macOS leg alone, which on a private repository's monthly allowance is a
    # few pushes. It never actually ran before — `needs: verify` kept it behind
    # a job that was being cancelled at its timeout — so raising that timeout
    # would have switched this on for every push to every branch at once.
    #
    # The branch name is read from the event rather than hard-coded, so this
    # stays correct whatever the default branch is called and if it is ever
    # renamed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ matrix.os }}
    # Same reasoning as the verify job above, and the same arithmetic: this job
    # runs the engine suite, which is where nearly all of that time goes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node: "22"
          - os: windows-latest
            node: "22"
          - os: ubuntu-latest
            node: "24"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The golden hashes are already pinned by the test suite on the primary
      # runner. What that cannot show is cross-platform or cross-Node drift —
      # exactly how a determinism bug (float formatting, LUT construction,
      # typed-array assumptions) would reach an artificial-life simulation.
      # Same engine, same expected hashes, different machine.
      - name: Engine golden hashes
        run: pnpm exec vitest run packages/engine

      - name: Headless runner reproduces the fixture hashes
        run: pnpm exec tsx scripts/headless.ts --ticks 1000 --checkpoints 0,1,10,100,1000
